<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TRUST ARC | 自分を知る旅</title><style>
:root{--bg:#071421;--panel:#102638;--panel2:#173349;--line:#2c4b60;--cyan:#6be3e5;--text:#e9f7fc;--muted:#a4c1cf;--gold:#f4d78c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#173b50,transparent 40%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:225px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 15px;position:sticky;top:0;height:100vh;background:#0a1b2a}.brand{font-weight:900;letter-spacing:2px;font-size:21px;margin:0 10px 6px}.tagline{font-size:11px;color:var(--muted);margin:0 10px 32px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:13px 14px;border-radius:12px}.nav button.active,.nav button:hover{background:#1a394c;color:var(--cyan)}.sidefoot{position:absolute;bottom:25px;font-size:11px;color:var(--muted);padding:0 10px}.main{padding:28px 34px 70px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--cyan);font-weight:700}.h1{font-size:29px;font-weight:800;margin:5px 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.8}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#29546a;border:1px solid #5da3b0}.panel{background:linear-gradient(145deg,#142e40,#102335);border:1px solid var(--line);border-radius:19px;padding:23px}.hero{padding:31px;display:flex;justify-content:space-between;gap:20px;align-items:center;background:radial-gradient(circle at 85% 30%,#276b7c,transparent 48%),linear-gradient(120deg,#17364a,#0d2436)}.hero h2{font-size:27px;line-height:1.5;margin:7px 0}.hero-art{font-size:85px;filter:drop-shadow(0 10px 20px #0005)}.btn{border:0;border-radius:11px;background:var(--cyan);color:#092433;padding:11px 16px;font-weight:800}.btn.alt{background:#24475b;color:var(--text);border:1px solid #3c6578}.btn.small{padding:8px 12px;font-size:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.section{margin-top:26px}.section-title{font-size:18px;margin:0 0 15px}.stat{font-size:30px;font-weight:900;color:var(--cyan)}.muted{color:var(--muted)}.mini{font-size:12px;line-height:1.7}.chip{display:inline-flex;border:1px solid #417185;border-radius:99px;padding:5px 10px;color:#c5eaf0;font-size:11px;margin:3px}.experience{display:flex;flex-direction:column;gap:9px}.experience .visual{height:105px;border-radius:12px;display:grid;place-items:center;font-size:52px;background:linear-gradient(125deg,#1e4b61,#193147)}.experience h3{margin:4px 0 0;font-size:15px}.experience p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.bar{height:9px;background:#244354;border-radius:20px;overflow:hidden;margin:8px 0 12px}.bar span{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,#37a9c2,#83f0dd)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.list{display:flex;flex-direction:column;gap:12px}.item{padding:14px;border-radius:13px;background:#17364a;border:1px solid #31536a}.item h4{margin:0 0 5px}.item p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field label{font-size:12px;color:#cde9f0;font-weight:700}.field input,.field select,.field textarea{background:#091c2c;border:1px solid #3c6378;color:var(--text);padding:12px;border-radius:10px;width:100%}.field textarea{min-height:92px;resize:vertical}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button{background:#19384b;border:1px solid #31546b;color:#c6e3ed;padding:9px 12px;border-radius:10px}.tabs button.active{background:var(--cyan);color:#0a2432}.profile{background:#f7fbfd;color:#173343;border-radius:16px;padding:25px}.profile .muted{color:#536c78}.profile h2{font-size:25px;margin:2px 0}.profile .chip{border-color:#c2d6dc;color:#174759}.profile .block{padding:15px 0;border-top:1px solid #d8e4e8}.profile .block h3{font-size:14px;margin:0 0 9px}.profile .block p{font-size:13px;line-height:1.8;margin:4px 0}.video{background:linear-gradient(125deg,#1e4a62,#0d2333);color:white;border-radius:12px;padding:20px;text-align:center}.notice{background:#1c3a48;border-left:3px solid var(--gold);padding:13px;border-radius:8px;font-size:12px;line-height:1.8}.hidden{display:none!important}.phone{max-width:340px;border:8px solid #06131f;border-radius:32px;background:#102638;padding:15px;box-shadow:0 20px 40px #0005}.phone .screen{background:linear-gradient(#1c4558,#10283a);border-radius:19px;padding:20px;min-height:350px}.kpi{color:var(--cyan);font-size:25px;font-weight:900}.empty{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;right:20px;background:#23566a;padding:12px 18px;border-radius:10px;box-shadow:0 6px 24px #0007;display:none}.file-check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.file-check input{accent-color:#6be3e5}@media(max-width:800px){.shell{display:block}.sidebar{position:relative;height:auto;padding:16px}.brand{margin:0}.tagline{margin:4px 0 12px}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;padding:10px}.sidefoot{display:none}.main{padding:18px}.grid,.grid.two{grid-template-columns:1fr}.hero-art{display:none}.h1{font-size:24px}.hero h2{font-size:23px}}@media print{body{background:white}.sidebar,.top,.no-print,.section:not(.print-area){display:none!important}.shell{display:block}.main{padding:0}.print-area{margin:0}.profile{border-radius:0;padding:0}.panel{border:0;background:white;padding:0}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">TRUST <span style="color:var(--cyan)">ARC</span></div><div class="tagline">自分を知ることで、人生はもっと面白くなる。</div><nav class="nav" id="nav"><button data-page="home" class="active">⌂　ホーム</button><button data-page="explore">✧　体験を探す</button><button data-page="journal">▤　マイ体験記録</button><button data-page="discover">◈　自分を知る</button><button data-page="stories">◎　誰かの経験</button><button data-page="file">▣　TRUST FILE</button><button data-page="settings">⚙　設定・プライバシー</button></nav><div class="sidefoot">DEMO PROTOTYPE · 架空のデータを使用<br>情報はこのブラウザ内に保存</div></aside><main class="main"><header class="top no-print"><div><div class="eyebrow" id="eyebrow">YOUR DISCOVERY JOURNEY</div><div class="h1" id="heading">こんにちは、未来の自分。</div><div class="sub" id="subtitle">今日もまだ知らない「好き」に出会おう。</div></div><div class="avatar">✦</div></header><div id="content"></div></main></div><div class="toast" id="toast"></div><script>
const seed=[{id:1,title:'チームで新しい商品を企画',category:'企画・チーム',emoji:'🧩',date:'2026-10-15',action:'異なる意見を聞き、共通点を整理して発表内容をまとめた。',feeling:'アイデアを出すより、みんなの意見をつなげる時間が楽しかった。',strength:'調整力・傾聴',challenge:'初対面では自分から話し始めるのに時間がかかった。',rating:5},{id:2,title:'VRものづくりラボ',category:'創作・VR',emoji:'🛠️',date:'2026-10-21',action:'試作品の構造を変えながら、3回試して完成させた。',feeling:'一人で集中して試行錯誤することが楽しかった。',strength:'粘り強さ・改善',challenge:'時間配分がうまくできず、最後は急いでしまった。',rating:4},{id:3,title:'バーチャル料理チャレンジ',category:'料理・VR',emoji:'🍳',date:'2026-10-25',action:'レシピを確認しながら調理手順を組み立てた。',feeling:'思ったより料理の工程を考えるのが面白かった。',strength:'計画性・好奇心',challenge:'初めての道具には戸惑った。',rating:4}];
const experiences=[{title:'未来の料理スタジオ',emoji:'🍳',type:'VR・料理',desc:'世界中の料理に挑戦。手順を工夫する楽しさを発見。',category:'料理・VR'},{title:'アイデア共創ラボ',emoji:'🧩',type:'チーム・企画',desc:'初めて会う仲間と新しい商品を考えてみよう。',category:'企画・チーム'},{title:'宇宙ものづくり工房',emoji:'🚀',type:'VR・創作',desc:'無重力空間で設計と試作。失敗も発見に変わる。',category:'創作・VR'},{title:'音と表現のステージ',emoji:'🎧',type:'音楽・表現',desc:'音楽や演出で自分の感性を表現する。',category:'音楽・表現'},{title:'みんなで街をデザイン',emoji:'🏙️',type:'社会・チーム',desc:'人が暮らしやすい未来の街を考える。',category:'社会・チーム'},{title:'未知の自然を探検',emoji:'🌿',type:'VR・冒険',desc:'普段行けない場所で新しい興味を探す。',category:'冒険・VR'}];
let records=JSON.parse(localStorage.getItem('ta_records')||'null')||seed;let name=localStorage.getItem('ta_name')||'山田 太郎';let share=localStorage.getItem('ta_share')==='true';let page='home';let filter='すべて';const $=s=>document.querySelector(s);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('ta_records',JSON.stringify(records));function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();window.scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));function card(t,body){return `<div class="panel"><h3 class="section-title">${t}</h3>${body}</div>`}function render(){const headings={home:['こんにちは、未来の自分。','今日もまだ知らない「好き」に出会おう。'],explore:['体験を探す','好奇心のままに、まだ知らない世界へ。'],journal:['マイ体験記録','できたことも、難しかったことも、大切な発見。'],discover:['自分を知る','体験を重ねると、自分らしさの輪郭が見えてくる。'],stories:['誰かの経験','過去の誰かの挑戦が、未来の自分のヒントに。'],file:['TRUST FILE','体験から生まれる、あなただけのプロフィール。'],settings:['設定・プライバシー','自分の情報は、自分で選んで管理。']};$('#heading').textContent=headings[page][0];$('#subtitle').textContent=headings[page][1];$('#content').innerHTML=({home,explore,journal,discover,stories,file,settings})[page]();bind()}
function home(){return `<section class="panel hero"><div><div class="eyebrow">DISCOVER YOURSELF</div><h2>まだ知らない自分に、<br>出会いにいこう。</h2><p class="sub">正解を探す場所じゃない。好きなことを見つける旅。</p><button class="btn" onclick="go('explore')">新しい体験を探す →</button></div><div class="hero-art">🌌</div></section><section class="section grid"><div class="panel"><div class="muted mini">これまでの体験</div><div class="stat">${records.length}<span class="mini"> 回</span></div><div class="mini muted">一つひとつが自分の発見</div></div><div class="panel"><div class="muted mini">見つかった興味</div><div class="stat">${new Set(records.map(x=>x.category)).size}<span class="mini"> 分野</span></div><div class="mini muted">もっと広げてみよう</div></div><div class="panel"><div class="muted mini">次の一歩</div><div class="stat">∞</div><div class="mini muted">可能性に上限はない</div></div></section><section class="section"><h3 class="section-title">あなたへのおすすめ</h3><div class="grid">${experiences.slice(0,3).map(expCard).join('')}</div></section><section class="section grid two">${card('最近の発見',`<p class="sub">${escapeHtml(records.at(-1)?.feeling||'最初の体験を記録してみよう。')}</p><button class="btn alt small" onclick="go('journal')">記録を見る →</button>`)}${card('未来につながるヒント','<p class="sub">似た興味を持つ人の体験から、新しい趣味や挑戦を見つけよう。</p><button class="btn alt small" onclick="go(\'stories\')">誰かの経験を見る →</button>')}</section>`}
function expCard(e){return `<div class="panel experience"><div class="visual">${e.emoji}</div><span class="eyebrow">${escapeHtml(e.type)}</span><h3>${escapeHtml(e.title)}</h3><p>${escapeHtml(e.desc)}</p><button class="btn alt small" onclick="startExp('${escapeHtml(e.title)}','${escapeHtml(e.category)}')">この体験を記録する</button></div>`}
function explore(){let arr=filter==='すべて'?experiences:experiences.filter(e=>e.type.includes(filter));return `<div class="tabs no-print">${['すべて','VR','チーム','料理','創作','音楽'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><div class="grid">${arr.map(expCard).join('')}</div><div class="section notice">これは体験施設の構想を示すデモです。予約や実際のVR体験はできません。</div>`}
function startExp(title,category){go('journal');$('#entryTitle').value=title;$('#entryCategory').value=category;$('#entryTitle').focus()}
function journal(){return `<div class="grid two"><div class="panel"><h3 class="section-title">新しい体験を記録する</h3><form id="entryForm"><div class="field"><label>体験名</label><input id="entryTitle" required placeholder="例：VRで宇宙の街を設計"></div><div class="field"><label>ジャンル</label><select id="entryCategory">${['企画・チーム','創作・VR','料理・VR','音楽・表現','社会・チーム','冒険・VR','日常の発見','その他'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>何に取り組んだ？（事実）</label><textarea id="entryAction" required placeholder="実際にしたことを具体的に"></textarea></div><div class="field"><label>何が楽しかった？ 何を感じた？</label><textarea id="entryFeeling" required placeholder="気づいたこと・夢中になったこと"></textarea></div><div class="field"><label>発揮できたこと・得意かもしれないこと</label><input id="entryStrength" placeholder="例：アイデア出し、聞く力"></div><div class="field"><label>難しかったこと・次に挑戦したいこと</label><input id="entryChallenge" placeholder="例：時間配分、初対面で話すこと"></div><div class="field"><label>楽しさの度合い</label><select id="entryRating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)}</option>`).join('')}</select></div><button class="btn" type="submit">体験を保存する</button></form></div><div><h3 class="section-title">あなたの体験履歴（${records.length}件）</h3><div class="list">${records.slice().reverse().map(x=>`<div class="item"><div class="row"><h4>${escapeHtml(x.emoji||'✦')} ${escapeHtml(x.title)}</h4><span class="muted mini">${escapeHtml(x.date)}</span></div><p>行動：${escapeHtml(x.action)}</p><p>発見：${escapeHtml(x.feeling)}</p><p>得意：${escapeHtml(x.strength)}</p><p>難しかったこと：${escapeHtml(x.challenge)}</p><div class="row" style="margin-top:9px"><span style="color:var(--gold)">${'★'.repeat(x.rating)}</span><button class="btn alt small" onclick="delRecord(${x.id})">削除</button></div></div>`).join('')||'<p class="empty">記録はまだありません。</p>'}</div></div></div>`}
function delRecord(id){if(confirm('この体験記録を削除しますか？')){records=records.filter(x=>x.id!==id);save();render()}}
function discover(){let strengths={};records.forEach(x=>x.strength.split(/[・、,]/).map(v=>v.trim()).filter(Boolean).forEach(v=>strengths[v]=(strengths[v]||0)+1));let sorted=Object.entries(strengths).sort((a,b)=>b[1]-a[1]);return `<div class="notice">AI分析を想定した画面です。このデモでは、入力された記録の語句を集計して表示しています。性格・能力を自動判定するものではありません。</div><section class="section grid two">${card('よく現れた特徴',sorted.length?sorted.slice(0,6).map(([k,v])=>`<div class="row mini"><strong>${escapeHtml(k)}</strong><span>${v}回の記録</span></div><div class="bar"><span style="width:${Math.min(100,v/Math.max(1,records.length)*100)}%"></span></div>`).join(''):'<p class="empty">記録を追加すると表示されます。</p>')}${card('興味の広がり',`<div style="display:flex;flex-wrap:wrap;gap:7px">${[...new Set(records.map(x=>x.category))].map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join('')}</div><p class="sub">「得意」と「好き」は同じとは限りません。楽しかった経験も大切にしよう。</p>`)}</section><section class="section">${card('これまでの発見から考える、次の一歩',`<div class="grid two"><div><h4>好きなことを深める</h4><p class="sub">楽しかった活動をもう一度。次は違う役割に挑戦してみよう。</p><button class="btn alt small" onclick="go('explore')">体験を探す</button></div><div><h4>意外な世界に飛び込む</h4><p class="sub">まだ選んでいないジャンルを試すと、新しい自分に出会えるかも。</p><button class="btn alt small" onclick="go('explore')">未知の体験へ</button></div></div>`)}</section>`}
function stories(){let stories=[['🎨','自分は絵が苦手だと思っていた','ものづくりを体験して、色を組み合わせる楽しさを知った。今は休日にデザインを楽しんでいる。','創作・表現'],['🤝','人前で話すのが苦手だった','チーム企画で人の話を聞く役割に夢中になった。話すこと以外にもチームに貢献する方法があると気づいた。','チーム・交流'],['🍳','料理は自分には関係ないと思っていた','体験をきっかけに家族と料理を始めた。小さな発見が毎日の楽しみになった。','料理・日常'],['🌱','転職ではなく新しい趣味が見つかった','自然のVR体験から植物に興味を持ち、近所の公園を歩く時間が増えた。','冒険・自然']];return `<div class="notice">以下は架空の体験談です。実際のサービスでは、本人が公開を許可した経験だけを掲載する想定です。</div><section class="section grid two">${stories.map(s=>`<div class="panel"><div style="font-size:35px">${s[0]}</div><span class="eyebrow">${s[3]}</span><h3>${s[1]}</h3><p class="sub">${s[2]}</p><span class="chip">誰かの経験から学ぶ</span></div>`).join('')}</section>`}
function file(){let selected=records.slice(0,5);let strengths=[...new Set(records.flatMap(x=>x.strength.split(/[・、,]/).map(v=>v.trim()).filter(Boolean)))].slice(0,8);return `<div class="row no-print" style="margin-bottom:16px"><div class="sub">履歴書の代わり、または補足として使える新しい資料の構想</div><button class="btn" onclick="window.print()">印刷・PDFに保存</button></div><section class="print-area"><div class="profile"><div class="row"><div><div style="font-size:11px;letter-spacing:3px;color:#287b8c;font-weight:800">TRUST ARC · EXPERIENCE PROFILE</div><h2>TRUST FILE</h2><div class="muted mini">体験が語る、わたしのプロフィール</div></div><div style="font-size:40px">◈</div></div><div class="block"><div class="row"><div><div style="font-size:21px;font-weight:800">${escapeHtml(name)}</div><p class="muted">${records.length}件の体験から作成したサンプルプロフィール</p></div><div style="font-size:32px">👤</div></div></div><div class="block"><h3>01｜体験から見えてきた特徴</h3>${strengths.map(x=>`<span class="chip">${escapeHtml(x)}</span>`).join('')||'<p>体験を記録すると表示されます。</p>'}<p class="muted">本人が記録した経験をもとにした整理であり、能力を保証・判定するものではありません。</p></div><div class="block"><h3>02｜取り組んだこと・行動の記録</h3>${selected.map((x,i)=>`<p><strong>${i+1}. ${escapeHtml(x.title)}</strong> <span class="muted">（${escapeHtml(x.date)}）</span></p><p><strong>実際の行動：</strong>${escapeHtml(x.action)}</p><p><strong>感じたこと：</strong>${escapeHtml(x.feeling)}</p><p><strong>難しかったこと：</strong>${escapeHtml(x.challenge)}</p>`).join('')}</div><div class="block"><h3>03｜得意と苦手、両方を知る</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div><strong>発揮できたこと</strong>${selected.slice(0,3).map(x=>`<p>✓ ${escapeHtml(x.strength)}</p>`).join('')}</div><div><strong>これから伸ばしたいこと</strong>${selected.slice(0,3).map(x=>`<p>↗ ${escapeHtml(x.challenge)}</p>`).join('')}</div></div></div><div class="block"><h3>04｜体験映像・活動の様子</h3><div class="video"><div style="font-size:33px">▶</div><div>体験動画プレビュー（サンプル）</div><div class="mini">本人が共有を許可した動画を掲載する想定</div></div></div><div class="block"><h3>05｜本人の確認と共有</h3><p>この資料は本人の記録をもとに構成したデモです。実際の運用では、AIの文章を本人が確認・修正し、企業に共有する項目を選択できます。</p><p class="muted">作成日：${new Date().toLocaleDateString('ja-JP')}　｜　TRUST ARC DEMO</p></div></div></section><div class="section notice no-print">重要：ここにある映像欄は再生可能な実映像ではなくサンプル表示です。提出前に本人の同意、映り込む人の同意、事実確認が必要です。</div>`}
function settings(){return `<div class="grid two">${card('プロフィール',`<div class="field"><label>表示名</label><input id="nameField" value="${escapeHtml(name)}"></div><button class="btn small" onclick="name=($('#nameField').value.trim()||'ゲスト');localStorage.setItem('ta_name',name);toast('表示名を保存しました')">保存</button>`)}${card('共有設定',`<p class="sub">体験記録やTRUST FILEは、本人が選ぶまで企業や他の利用者に公開されません。</p><label class="file-check"><input type="checkbox" id="shareField" ${share?'checked':''}> 公開の意向を保存（実際の外部送信は行いません）</label><button class="btn alt small" style="margin-top:14px" onclick="share=$('#shareField').checked;localStorage.setItem('ta_share',share);toast('設定を保存しました')">設定を保存</button>`)}</div><section class="section">${card('デモデータの管理',`<p class="sub">このアプリはインターネット上のサーバーへ記録を送信しません。保存先は使用中のブラウザです。</p><button class="btn alt small" onclick="if(confirm('体験記録を初期状態に戻しますか？')){records=seed;save();toast('初期状態に戻しました');render()}">サンプルに戻す</button> <button class="btn alt small" onclick="if(confirm('すべての体験記録を消去しますか？')){records=[];save();toast('記録を消去しました');render()}">記録を全消去</button>`)}</section>`}
function bind(){const f=$('#entryForm');if(f)f.onsubmit=e=>{e.preventDefault();records.push({id:Date.now(),title:$('#entryTitle').value,category:$('#entryCategory').value,emoji:'✨',date:new Date().toISOString().slice(0,10),action:$('#entryAction').value,feeling:$('#entryFeeling').value,strength:$('#entryStrength').value||'まだ整理中',challenge:$('#entryChallenge').value||'まだ整理中',rating:Number($('#entryRating').value)});save();toast('新しい体験を記録しました！');render()}}
render();</script></body></html>
